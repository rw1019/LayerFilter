<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图层筛选</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="panel">
        <header class="panel-header">
            <img class="panel-icon" src="icons/IconDark@2X.png" alt="LayerFilter">
            <h1>图层筛选增强版</h1>
        </header>

        <!-- 模式选择 -->
        <fieldset class="section-fieldset">
            <legend>选择依据</legend>
            <div class="mode-options">
                <label class="option"><input type="radio" name="mode" value="price"> <span>价格文字（￥/¥/$/券后/到手价等）</span></label>
                <label class="option"><input type="radio" name="mode" value="style"> <span>与当前文字图层样式相同</span></label>
                <label class="option"><input type="radio" name="mode" value="content"> <span>文字内容匹配</span></label>
                <label class="option"><input type="radio" name="mode" value="name"> <span>图层名称匹配</span></label>
                <label class="option"><input type="radio" name="mode" value="group"> <span>图层组名称匹配</span></label>
                <label class="option"><input type="radio" name="mode" value="type"> <span>按图层类型筛选</span></label>
            </div>

            <!-- 可视化图层类型直接选（摒弃下拉菜单，采用 Photoshop 原生风格矢量图标） -->
            <div id="layer-type-grid" class="type-chip-grid hidden">
                <button type="button" class="type-chip active" data-type="text" title="筛选纯文字图层">
                    <svg class="chip-svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                        <path d="M2 3h12v2.5h-1.2c-.2-1-.5-1.3-1.8-1.3h-1.5v8.5c0 .7.3.8 1.2.8h.8V14.5H4.5V13.5h.8c.9 0 1.2-.1 1.2-.8V4.2H5c-1.3 0-1.6.3-1.8 1.3H2V3z"/>
                    </svg>
                    <span class="chip-label">文字</span>
                </button>
                <button type="button" class="type-chip" data-type="smartObject" title="筛选智能对象图层">
                    <svg class="chip-svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                        <path d="M5 1a1 1 0 0 0-1 1v6h2V3h4v3.5a.5.5 0 0 0 .5.5H14v6.5a.5.5 0 0 1-.5.5H8v2h5.5a2.5 2.5 0 0 0 2.5-2.5V7a1 1 0 0 0-.3-.7l-4.5-4.5A1 1 0 0 0 10.5 1H5zm6 1.4L13.6 6H11V2.4z"/>
                        <path d="M1 8a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H1z"/>
                    </svg>
                    <span class="chip-label">智能对象</span>
                </button>
                <button type="button" class="type-chip" data-type="shape" title="筛选矢量/形状图层">
                    <svg class="chip-svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                        <rect x="1" y="1" width="3.5" height="3.5" rx="0.5"/>
                        <rect x="11.5" y="1" width="3.5" height="3.5" rx="0.5"/>
                        <rect x="1" y="11.5" width="3.5" height="3.5" rx="0.5"/>
                        <rect x="11.5" y="11.5" width="3.5" height="3.5" rx="0.5"/>
                        <path d="M4.5 2.2h7v1.5h-7V2.2zm0 10.1h7v1.5h-7v-1.5zM2.2 4.5h1.5v7H2.2v-7zm10.1 0h1.5v7h-1.5v-7z"/>
                    </svg>
                    <span class="chip-label">形状</span>
                </button>
                <button type="button" class="type-chip" data-type="pixel" title="筛选普通像素图层">
                    <svg class="chip-svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                        <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h11A1.5 1.5 0 0 1 15 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5v-11zm1.5 0v11h11v-11h-11z"/>
                        <path d="M3.5 11.5l3-4 1.8 2.4 2.2-3 2.5 4.6h-9.5z"/>
                    </svg>
                    <span class="chip-label">像素</span>
                </button>
                <button type="button" class="type-chip" data-type="adjustment" title="筛选调整图层">
                    <svg class="chip-svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                        <path d="M8 1a7 7 0 1 0 7 7A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 0 1 3.89 9.39L4.11 4.11A5.47 5.47 0 0 1 8 2.5z"/>
                        <path d="M4.11 4.11L11.89 11.89A5.5 5.5 0 0 1 8 13.5c-3.04 0-5.5-2.46-5.5-5.5 0-1.46.57-2.8 1.61-3.89z"/>
                    </svg>
                    <span class="chip-label">调整层</span>
                </button>
                <button type="button" class="type-chip" data-type="group" title="筛选图层组">
                    <svg class="chip-svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                        <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h3.3a1.5 1.5 0 0 1 1.1.5L8.2 4H13.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9zm1.5 0a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V5.5a.5.5 0 0 0-.5-.5H7.8a1 1 0 0 1-.7-.3L5.7 3.5H2.5z"/>
                    </svg>
                    <span class="chip-label">图层组</span>
                </button>
            </div>
        </fieldset>

        <!-- 搜索输入行 -->
        <section id="query-row" class="query-row">
            <label for="query">关键词</label>
            <input id="query" type="text" placeholder="输入搜索词或价格符号..." autocomplete="off">
            <button id="btn-pick-name" class="btn-pick" type="button" title="点击获取当前选中的图层名称并填入关键词">填入</button>
            <select id="match-kind" aria-label="匹配方式">
                <option value="0">包含</option>
                <option value="1">开头是</option>
                <option value="2">完全相同</option>
                <option value="3">正则表达式</option>
            </select>
        </section>

        <!-- 样式匹配选项 -->
        <fieldset id="style-options" class="section-fieldset">
            <legend>同样式匹配项目</legend>
            <div class="check-grid">
                <label><input id="match-font" type="checkbox"> 字体</label>
                <label><input id="match-size" type="checkbox"> 字号</label>
                <label><input id="match-color" type="checkbox"> 颜色</label>
                <label><input id="match-face" type="checkbox"> 粗体/斜体</label>
            </div>
        </fieldset>

        <!-- 范围与匹配偏好 -->
        <fieldset class="section-fieldset">
            <legend>选项偏好</legend>
            <div class="check-grid">
                <label><input id="include-hidden" type="checkbox"> 包含隐藏图层</label>
                <label><input id="ignore-case" type="checkbox"> 忽略大小写</label>
            </div>
        </fieldset>

        <!-- 状态反馈栏 -->
        <div id="status" class="status" role="status" aria-live="polite">准备就绪</div>

        <!-- 主操作：选择匹配图层 -->
        <button id="select-layers" class="btn-primary" type="button">选择匹配图层 (Enter)</button>

        <!-- 快捷批处理工具栏（带 Photoshop 匹配原生风格图标） -->
        <div class="action-toolbar">
            <button id="btn-show" class="btn-secondary" type="button" title="直接显示所有匹配图层">
                <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                    <path d="M8 3C4.5 3 1.6 5.3.5 8.5 1.6 11.7 4.5 14 8 14s6.4-2.3 7.5-5.5C14.4 5.3 11.5 3 8 3zm0 9a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zm0-5.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                </svg>
                <span>显示</span>
            </button>
            <button id="btn-hide" class="btn-secondary" type="button" title="直接隐藏所有匹配图层">
                <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                    <path d="M1.3 1.3l13.4 13.4-1 1-2.5-2.5C9.9 13.7 8.9 14 8 14 4.5 14 1.6 11.7.5 8.5c.7-2 2-3.6 3.8-4.6L2.3 2.3l-1-1zm3.8 5.2a3.5 3.5 0 0 0 4.9 4.9l-4.9-4.9zM8 3c3.5 0 6.4 2.3 7.5 5.5-.6 1.7-1.7 3.1-3.2 4.1l-1.1-1.1c1.1-.8 1.9-1.8 2.5-3-1-2.5-3.4-4.5-5.7-4.5-.7 0-1.4.2-2 .5L4.7 3.3C5.7 3.1 6.8 3 8 3z"/>
                </svg>
                <span>隐藏</span>
            </button>
            <button id="btn-lock" class="btn-secondary" type="button" title="锁定所有匹配图层">
                <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                    <path d="M11.5 6V4.5a3.5 3.5 0 1 0-7 0V6H3v8h10V6h-1.5zm-5.5-1.5a2 2 0 1 1 4 0V6H6V4.5zM8 11.5a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/>
                </svg>
                <span>锁定</span>
            </button>
            <button id="btn-group" class="btn-secondary" type="button" title="将匹配图层打包成新组">
                <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                    <path d="M1.5 2.5A1.5 1.5 0 0 0 0 4v8a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 16 12V5.5A1.5 1.5 0 0 0 14.5 4H7.8L6.4 2.6A1.5 1.5 0 0 0 5.4 2.2H1.5z"/>
                </svg>
                <span>编组</span>
            </button>
            <button id="btn-copy-style" class="btn-secondary" type="button" title="复制当前选中图层的样式 (fx)">
                <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                    <path d="M3 1h7a1.5 1.5 0 0 1 1.5 1.5v1H10V2.5a.5.5 0 0 0-.5-.5H3a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .5.5H4v1.5H3A1.5 1.5 0 0 1 1.5 10V2.5A1.5 1.5 0 0 1 3 1zm3 3h7a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 13 15H6a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 6 4zm1.5 6.5h1.2V8.7h1.1V7.6H8.7V7c0-.2.1-.3.4-.3h.7V5.6h-1c-.9 0-1.3.5-1.3 1.3v.7H6.8v1.1h.7v1.8zm3.2 0h1.4l.8-1.2.8 1.2h1.4l-1.5-2 1.4-1.8H14l-.7 1-.7-1h-1.4l1.4 1.8-1.4 2z"/>
                </svg>
                <span>复制fx</span>
            </button>
            <button id="btn-paste-style" class="btn-secondary" type="button" title="将样式粘贴到当前选中的图层">
                <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                    <path d="M9.5 1a1.5 1.5 0 0 1 1.4 1H12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h1.1A1.5 1.5 0 0 1 6.5 1h3zm-3 1.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zM4 4a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H4zm3.5 7.5h1.2V9.7h1.1V8.6H8.7V8c0-.2.1-.3.4-.3h.7V6.6h-1c-.9 0-1.3.5-1.3 1.3v.7H6.8v1.1h.7v1.8zm3.2 0h1.4l.8-1.2.8 1.2h1.4l-1.5-2 1.4-1.8H14l-.7 1-.7-1h-1.4l1.4 1.8-1.4 2z"/>
                </svg>
                <span>粘贴fx</span>
            </button>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
